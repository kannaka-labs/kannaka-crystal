[package]
name = "kannaka-crystal"
version = "0.15.0"
edition = "2021"
description = "Kannaka Crystal — an experimental platform for informational materials and resonant memory systems"
license-file = "LICENSE"
repository = "https://github.com/flaukowski/kannaka-crystal"

[[bin]]
name = "kannaka-crystal"
path = "src/main.rs"

[lib]
# cdylib for the wasm32 build (in-browser engine on the Pages site);
# rlib so the bin + tests keep linking normally.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content hashing for primitive identity + deterministic text->wavefront
# encoding. Unconditional, mirroring kannaka-memory's provenance path.
blake3 = "1.5"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"

# Native-only: the CLI, registry persistence, and the HTTP server have no
# business in the wasm engine build (and tiny_http/dirs don't target wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Pure-Rust embedded HTTP server for the REST API + Observatory. Chosen over
# axum/tokio to keep the default build lean and dependency-light — the API is
# a research surface, not a high-concurrency service.
tiny_http = "0.12"

# NATS swarm integration (Explorer/Optimizer/Classifier/Dreamer agents publish
# and subscribe here). NOT in default features — mirrors kannaka-memory's
# `bridge` pattern so CI/default builds never pull a network stack.
# async-nats (not the deprecated sync `nats` crate): the sync crate drags in
# ring 0.16 / rustls-webpki 0.100-0.101, all of which carry open RUSTSEC
# advisories that fail the security audit workflow.
async-nats = { version = "0.50", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
futures = { version = "0.3", optional = true }

# OpenClawCity artifact publishing (`kannaka-crystal publish CRY-######`).
# Optional so lean/dev builds skip the HTTP+TLS client; release binaries are
# built WITH this feature (see .github/workflows/release.yml).
ureq = { version = "3", features = ["json"], optional = true }

# TOML gotcha that broke the v0.7.0 release the first time: everything
# below a [target...] header BELONGS to that table. The optional feature
# deps above must stay under the not(wasm32) table (or [dependencies]) —
# the wasm table must therefore be the LAST dependency section.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# rand's default `getrandom` feature needs the js backend on wasm32 even
# though every RNG we expose is ChaCha8-seeded (determinism is the point).
getrandom = { version = "0.2", features = ["js"] }

[features]
default = []
swarm = ["dep:async-nats", "dep:tokio", "dep:futures"]
publish = ["dep:ureq"]

[profile.release]
lto = true
strip = true

# wasm-opt's prebuilt binary is unreliable on Windows dev boxes; the raw
# wasm-bindgen output is ~small already and correctness beats 20% size.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
